#In options only "0" and "1" are accepted values
#MeuPocketGB: BOOT_LOGO=0 and USB_OTG=0 make the boot faster

MODULES_CUSTOM=0 #load custom drivers from /boot/modules_custom.sh
DEBUG=0 #debug whole OS & output logs to $HOME/log.txt
DEBUG_GMENU2X=0 #not used in MeuPocketGB
DEBUG_UMTPR=0 #debug USB storage protocol $HOME/log_umtpr.txt
FIRSTBOOT=0 #perform again firstboot setup (once after reboot)
FS_CHECK=1 #check FileSystems at startup, only after an unclean power-off
BOOT_LOGO=0 #MeuPocketGB: no boot logo animation
HOTKEY_CUSTOM=1 #use hotkeys from $HOME/.buttons.conf if present (see: https://github.com/MiyooCFW/daemon?tab=readme-ov-file#config)
USB_OTG=0 #MeuPocketGB: 1 = turn on USB file transfer (MTP), boot gets a bit slower
OSS=0 #load Open Sound System drivers in kernel
FLIP= #(put 0 or 1 to overwrite) flip display up/down
INVERT= #(put 0 or 1 to overwrite) change colors on display to normal/invert
TV_OUT= #not used in MeuPocketGB
