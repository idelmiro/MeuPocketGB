<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="80 52 850 410" width="850" height="410" role="img" aria-label="PocketGo ligando com o MeuPocketGB: tela de boot com barra de progresso">
  <title>PocketGo ligando com o MeuPocketGB: tela de boot com barra de progresso</title>
  <defs>
    <linearGradient id="corpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F2EC"/>
      <stop offset="1" stop-color="#ECE9E2"/>
    </linearGradient>
    <radialGradient id="roxo" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#C04A9F"/>
      <stop offset="1" stop-color="#962A78"/>
    </radialGradient>
    <radialGradient id="preto" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#46464D"/>
      <stop offset="1" stop-color="#1E1E22"/>
    </radialGradient>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="6" result="s"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="botao" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- shoulder grips (L / R) behind the body -->
  <rect x="104" y="66" width="120" height="40" rx="14" fill="#6B6B70"/>
  <rect x="786" y="66" width="120" height="40" rx="14" fill="#6B6B70"/>

  <!-- body -->
  <rect x="95" y="76" width="820" height="370" rx="62" fill="url(#corpo)" stroke="#D3CFC6" stroke-width="2" filter="url(#sombra)"/>

  <!-- screen: bezel, real capture (320x240), power LED -->
  <rect x="300" y="100" width="415" height="308" rx="18" fill="#5C5B6A"/>
  <rect x="300" y="100" width="415" height="308" rx="18" fill="none" stroke="#45444F" stroke-width="2"/>
  <rect x="343" y="121" width="334" height="252" rx="3" fill="#000"/>
  <image x="345" y="123" width="330" height="247.5" preserveAspectRatio="none" style="image-rendering:pixelated" xlink:href="data:image/png;base64," href="data:image/png;base64,"/>
  <circle cx="702" cy="140" r="3.2" fill="#72E04E"/>

  <!-- d-pad -->
  <g filter="url(#botao)">
    <rect x="115" y="195" width="150" height="56" rx="9" fill="#626266" stroke="#4A4A4F" stroke-width="2"/>
    <rect x="162" y="148" width="56" height="150" rx="9" fill="#626266" stroke="#4A4A4F" stroke-width="2"/>
    <rect x="164" y="197" width="52" height="52" fill="#626266"/>
  </g>
  <circle cx="190" cy="223" r="11" fill="#58585C"/>

  <!-- select / start -->
  <text x="226" y="344" font-family="Nunito, Arial, sans-serif" font-size="13" letter-spacing="1" fill="#A19D95" text-anchor="end">SELECT</text>
  <text x="226" y="396" font-family="Nunito, Arial, sans-serif" font-size="13" letter-spacing="1" fill="#A19D95" text-anchor="end">START</text>
  <circle cx="256" cy="339" r="18" fill="#626266" stroke="#4A4A4F" stroke-width="2" filter="url(#botao)"/>
  <circle cx="256" cy="391" r="18" fill="#626266" stroke="#4A4A4F" stroke-width="2" filter="url(#botao)"/>

  <!-- face buttons: X top, Y left, A right, B bottom -->
  <g filter="url(#botao)">
    <circle cx="818" cy="161" r="27" fill="url(#preto)"/>
    <circle cx="764" cy="215" r="27" fill="url(#preto)"/>
    <circle cx="871" cy="215" r="27" fill="url(#roxo)"/>
    <circle cx="818" cy="269" r="27" fill="url(#roxo)"/>
  </g>
  <g font-family="Nunito, Arial, sans-serif" font-size="15" font-weight="700" fill="#3A3F86" text-anchor="middle">
    <text x="818" y="211">X</text>
    <text x="764" y="265">Y</text>
    <text x="871" y="265">A</text>
    <text x="818" y="318">B</text>
  </g>

  <!-- speaker -->
  <g stroke-linecap="round">
    <line x1="760" y1="392" x2="770" y2="352" stroke="#BDB9B0" stroke-width="9"/>
    <line x1="760" y1="392" x2="770" y2="352" stroke="#8E8A83" stroke-width="4"/>
    <line x1="780" y1="390" x2="790" y2="346" stroke="#BDB9B0" stroke-width="9"/>
    <line x1="780" y1="390" x2="790" y2="346" stroke="#8E8A83" stroke-width="4"/>
    <line x1="800" y1="388" x2="810" y2="340" stroke="#BDB9B0" stroke-width="9"/>
    <line x1="800" y1="388" x2="810" y2="340" stroke="#8E8A83" stroke-width="4"/>
    <line x1="820" y1="386" x2="830" y2="334" stroke="#BDB9B0" stroke-width="9"/>
    <line x1="820" y1="386" x2="830" y2="334" stroke="#8E8A83" stroke-width="4"/>
    <line x1="840" y1="384" x2="850" y2="328" stroke="#BDB9B0" stroke-width="9"/>
    <line x1="840" y1="384" x2="850" y2="328" stroke="#8E8A83" stroke-width="4"/>
  </g>
</svg>
